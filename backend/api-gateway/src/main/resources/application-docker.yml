# Docker profile overrides — container-internal hostnames
server:
  port: 8080

spring:
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/default
        - id: dummy-service
          uri: http://dummy-service:8082
          predicates:
            - Path=/api/v1/dummy/**
          filters:
            - name: CircuitBreaker
              args:
                name: dummyCircuitBreaker
                fallbackUri: forward:/fallback/default

# Route targets resolve via Docker DNS
omnichat:
  services:
    conversation-url: http://conversation-service:8080
    routing-url: http://routing-service:8080
    customer-url: http://customer-service:8080
    integration-url: http://integration-service:8080
    websocket-url: http://websocket-service:8080
    websocket-ws-url: ws://websocket-service:8080
