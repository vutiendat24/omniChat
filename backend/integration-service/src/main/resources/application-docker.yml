# Docker profile overrides — container-internal hostnames
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/integration_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD:password}

  data:
    redis:
      host: redis

  kafka:
    bootstrap-servers: kafka:29092
