# Docker profile overrides — container-internal hostnames
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/omnichat_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD:password}

  data:
    redis:
      host: redis

  kafka:
    producer:
      bootstrap-servers: kafka:29092
    consumer:
      bootstrap-servers: kafka:29092
