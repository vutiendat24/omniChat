# Docker profile — override internal hostnames
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/notification_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: password
  kafka:
    consumer:
      bootstrap-servers: kafka:29092

  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
